# Every push to main becomes a release: typecheck and tests, a build, a GitHub Release carrying the zip, and, once the
# Chrome Web Store secrets are set and the CWS_PUBLISH variable is "true" (docs/deploy.md), that zip uploaded and
# submitted to the store through its REST API.
# Only GitHub's own actions are used; pnpm comes from npm and the store calls are plain curl, signed with openssl.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm (the version package.json pins) and the dependencies
        run: |
          npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
          pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test

      # The store needs every upload to carry a higher version than the last. package.json holds the major and minor;
      # the run number makes the patch, so nothing has to be committed for a release.
      - name: Set the release version
        id: version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          version="$base.${{ github.run_number }}"
          npm pkg set version="$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and zip the extension
        run: |
          pnpm zip
          echo "zip=$(ls .output/*-chrome.zip)" >> "$GITHUB_ENV"

      - name: Publish the GitHub Release with the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" "$zip" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "Built from ${{ github.sha }}. Load unpacked from the zip, or wait for the Chrome Web Store update."

      # Off until the repository variable CWS_PUBLISH is "true" (Settings → Secrets and variables → Actions → Variables).
      # The store's API v2, as a service account the developer dashboard lists under Account (docs/deploy.md).
      - name: Upload to the Chrome Web Store and submit it for review
        if: vars.CWS_PUBLISH == 'true' && env.CWS_EXTENSION_ID != ''
        env:
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          ITEM: publishers/${{ secrets.CWS_PUBLISHER_ID }}/items/${{ secrets.CWS_EXTENSION_ID }}
        run: |
          set -euo pipefail
          # An access token for the service account: a JWT signed with its key, exchanged at Google's token endpoint.
          key=$(mktemp)
          jq -r .private_key <<< "$CWS_SERVICE_ACCOUNT_KEY" > "$key"
          base64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          header=$(printf '{"alg":"RS256","typ":"JWT"}' | base64url)
          claims=$(jq -nc --arg iss "$(jq -r .client_email <<< "$CWS_SERVICE_ACCOUNT_KEY")" --argjson iat "$(date +%s)" \
            '{iss: $iss, scope: "https://www.googleapis.com/auth/chromewebstore", aud: "https://oauth2.googleapis.com/token", iat: $iat, exp: ($iat + 600)}' | base64url)
          signature=$(printf '%s.%s' "$header" "$claims" | openssl dgst -sha256 -sign "$key" | base64url)
          rm "$key"
          token=$(curl -sS --fail-with-body -X POST https://oauth2.googleapis.com/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer -d assertion="$header.$claims.$signature" | jq -r .access_token)
          test -n "$token" && test "$token" != null
          echo "::add-mask::$token"

          api=https://chromewebstore.googleapis.com
          upload=$(curl -sS --fail-with-body -X POST -H "Authorization: Bearer $token" -T "$zip" "$api/upload/v2/$ITEM:upload")
          echo "$upload"
          # A package the store is still processing is asked after every ten seconds, for five minutes at most.
          state=$(jq -r .uploadState <<< "$upload")
          for _ in $(seq 30); do
            [ "$state" = IN_PROGRESS ] || [ "$state" = UPLOAD_IN_PROGRESS ] || break
            sleep 10
            state=$(curl -sS --fail-with-body -H "Authorization: Bearer $token" "$api/v2/$ITEM:fetchStatus" | jq -r .lastAsyncUploadState)
          done
          echo "Upload: $state"
          test "$state" = SUCCEEDED

          publish=$(curl -sS --fail-with-body -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" -d '{}' "$api/v2/$ITEM:publish")
          echo "$publish"
          jq -e '.state | IN("PENDING_REVIEW", "STAGED", "PUBLISHED", "PUBLISHED_TO_TESTERS")' <<< "$publish" > /dev/null
