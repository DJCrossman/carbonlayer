query PullRequestPage($owner: String!, $name: String!, $number: Int!) {
  rateLimit { cost remaining resetAt }
  repository(owner: $owner, name: $name) {
    id nameWithOwner viewerPermission viewerDefaultMergeMethod
    mergeCommitAllowed squashMergeAllowed rebaseMergeAllowed autoMergeAllowed
    pullRequest(number: $number) {
      id number title url body bodyHTML state isDraft locked
      createdAt updatedAt closedAt mergedAt
      author { ...ActorFields }
      headRefName headRefOid baseRefName baseRefOid
      headRepository { nameWithOwner }
      baseRef { name target { oid } }
      isCrossRepository
      mergeable mergeStateStatus reviewDecision
      isInMergeQueue
      autoMergeRequest { enabledAt mergeMethod enabledBy { login } }
      viewerCanUpdate viewerDidAuthor viewerCanEnableAutoMerge viewerCanDisableAutoMerge
      viewerCanMergeAsAdmin viewerCanUpdateBranch
      viewerLatestReview { id state submittedAt }
      additions deletions changedFiles
      stack { number size baseRefName }
      stackEntry { position }
      labels(first: 20) { nodes { id name color } }
      assignees(first: 10) { nodes { login avatarUrl } }
      reviewRequests(first: 20) {
        nodes { asCodeOwner requestedReviewer { ...ReviewerFields } }
      }
      latestOpinionatedReviews(first: 20, writersOnly: true) {
        nodes { id state submittedAt author { ...ActorFields } }
      }
      commits(last: 1) {
        totalCount
        nodes {
          commit {
            oid
            statusCheckRollup {
              state
              contexts(first: 100) {
                totalCount
                pageInfo { hasNextPage endCursor }
                nodes {
                  __typename
                  ... on CheckRun {
                    name status conclusion detailsUrl title startedAt completedAt
                    isRequired(pullRequestNumber: $number)
                    checkSuite { app { name slug } workflowRun { workflow { name } } }
                  }
                  ... on StatusContext {
                    context state targetUrl description avatarUrl
                    isRequired(pullRequestNumber: $number)
                  }
                }
              }
            }
          }
        }
      }
      reviewThreads(first: 100) {
        totalCount
        pageInfo { hasNextPage endCursor }
        nodes {
          id isResolved isOutdated isCollapsed
          path line startLine originalLine originalStartLine diffSide startDiffSide subjectType
          viewerCanResolve viewerCanUnresolve viewerCanReply
          resolvedBy { login }
          comments(first: 50) {
            totalCount
            nodes {
              id author { ...ActorFields } body bodyHTML createdAt
              path line originalLine startLine outdated diffHunk url
              replyTo { id }
              pullRequestReview { id state }
            }
          }
        }
      }
      timelineItems(
        first: 100
        itemTypes: [
          ISSUE_COMMENT, PULL_REQUEST_REVIEW, REVIEW_REQUESTED_EVENT, REVIEW_REQUEST_REMOVED_EVENT,
          READY_FOR_REVIEW_EVENT, CONVERT_TO_DRAFT_EVENT, MERGED_EVENT, CLOSED_EVENT, REOPENED_EVENT,
          HEAD_REF_FORCE_PUSHED_EVENT, BASE_REF_CHANGED_EVENT, PULL_REQUEST_COMMIT, REVIEW_DISMISSED_EVENT
        ]
      ) {
        totalCount
        pageInfo { hasNextPage endCursor }
        nodes {
          __typename
          ... on IssueComment { id author { ...ActorFields } body bodyHTML createdAt url isMinimized minimizedReason viewerCanUpdate }
          ... on PullRequestReview {
            id state body bodyHTML submittedAt createdAt url author { ...ActorFields }
            comments(first: 1) { totalCount }
          }
          ... on ReviewRequestedEvent { id createdAt actor { login } requestedReviewer { ...ReviewerFields } }
          ... on ReviewRequestRemovedEvent { id createdAt actor { login } requestedReviewer { ...ReviewerFields } }
          ... on ReadyForReviewEvent { id createdAt actor { login } }
          ... on ConvertToDraftEvent { id createdAt actor { login } }
          ... on MergedEvent { id createdAt actor { login } mergeRefName commit { oid abbreviatedOid } }
          ... on ClosedEvent { id createdAt actor { login } }
          ... on ReopenedEvent { id createdAt actor { login } }
          ... on HeadRefForcePushedEvent { id createdAt actor { login } beforeCommit { oid abbreviatedOid } afterCommit { oid abbreviatedOid } }
          ... on BaseRefChangedEvent { id createdAt actor { login } previousRefName currentRefName }
          ... on ReviewDismissedEvent { id createdAt actor { login } previousReviewState dismissalMessage }
          ... on PullRequestCommit {
            id url
            commit { oid abbreviatedOid messageHeadline committedDate author { name user { login avatarUrl } } }
          }
        }
      }
    }
  }
}

fragment ActorFields on Actor { __typename login avatarUrl url }

fragment ReviewerFields on RequestedReviewer {
  __typename
  ... on User { id login avatarUrl }
  ... on Team { id slug combinedSlug name }
  ... on Bot { id login avatarUrl }
  ... on Mannequin { id login avatarUrl }
}
