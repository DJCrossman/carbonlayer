query StackNeighbours($owner: String!, $name: String!, $head: String!, $base: String!) {
  repository(owner: $owner, name: $name) {
    defaultBranchRef { name }
    # PRs whose head is this PR's base  => the PR directly below (parent)
    below: pullRequests(headRefName: $base, states: [OPEN, MERGED], first: 5, orderBy: {field: UPDATED_AT, direction: DESC}) {
      nodes { number title url state isDraft headRefName baseRefName reviewDecision }
    }
    # PRs whose base is this PR's head  => PRs stacked on top (children)
    above: pullRequests(baseRefName: $head, states: OPEN, first: 10, orderBy: {field: UPDATED_AT, direction: DESC}) {
      nodes { number title url state isDraft headRefName baseRefName reviewDecision }
    }
  }
}
